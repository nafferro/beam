name: Beam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Set your Apple team ID here (or pick it in Xcode under Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Beam:
    type: application
    platform: iOS
    sources: [Beam]
    info:
      path: Beam/Info.plist
      properties:
        CFBundleDisplayName: Beam
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: This app uses Bluetooth to connect to your headlamp.
    settings:
      base:
        # Change this to an identifier of your own.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.beam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  BeamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BeamTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.beam.tests
    dependencies:
      - target: Beam
schemes:
  Beam:
    build:
      targets:
        Beam: all
    test:
      targets: [BeamTests]
